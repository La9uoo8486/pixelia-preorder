<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixelia</title>
  <script>
    // GitHub Pages 짧은 링크: /r/닉네임  ->  ./?ref=닉네임
    (function () {
      var m = location.pathname.match(/^(.*?\/)r\/([^\/]+)\/?$/);
      if (m) {
        var nick;
        try { nick = decodeURIComponent(m[2]); } catch (e) { nick = m[2]; }
        location.replace(m[1] + '?ref=' + encodeURIComponent(nick));
      }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14122b; color: #f2f0ff; font-family: sans-serif; text-align: center; padding: 16px; }
    a { color: #ffd23f; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>페이지를 찾을 수 없어요.</p>
    <p><a id="home" href="/">메인으로</a></p>
  </div>
  <script>
    // github.io 프로젝트 페이지면 /저장소이름/ 이 메인
    if (/\.github\.io$/.test(location.hostname)) {
      var seg = location.pathname.split('/')[1];
      if (seg) document.getElementById('home').href = '/' + seg + '/';
    }
  </script>
</body>
</html>
